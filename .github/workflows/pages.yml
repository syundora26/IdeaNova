name: Publish IdeaNova design preview
on:
  push:
    branches:
      - main
      - claude/cosmic-animation-hp-design-nq2g4w
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ideanova-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:share
      - name: Add the SD cosmic site under /sd/
        run: |
          mkdir -p dist/share/sd
          cp -r sd-cosmic-bright/index.html sd-cosmic-bright/assets sd-cosmic-bright/images sd-cosmic-bright/favicon.svg sd-cosmic-bright/og.png sd-cosmic-bright/robots.txt dist/share/sd/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/share
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v5
